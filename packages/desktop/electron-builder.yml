appId: app.mockupstudio.desktop
productName: Mockup Studio
copyright: Mockup Studio
# versão exata e binários locais: sem download do Electron (o pacote declara um intervalo)
electronVersion: 45.3.3
electronDist: ../../node_modules/electron/dist
directories:
  output: ../../dist
  buildResources: build
# O bundle do processo principal já embute todas as dependências (só `electron` é externo).
files:
  - out/**
  - '!out/cli/**' # o CLI vai em resources/cli (extraResources), fora do asar
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: ../editor/dist
    to: editor
  - from: ../../docs
    to: docs
  - from: build/icon.png
    to: icon.png
  # CLI embutido (gerado por scripts/build-cli.mjs): fora do asar, roda com ELECTRON_RUN_AS_NODE=1
  - from: out/cli
    to: cli
  # skill/snippets para integrar com Claude Code e Codex (pasta na raiz do repositório)
  - from: ../../integrations
    to: integrations
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  artifactName: MockupStudio-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: MockupStudio-Setup-${version}-${arch}.${ext}
  include: build/installer.nsh
portable:
  artifactName: MockupStudio-Portable-${version}-${arch}.${ext}
