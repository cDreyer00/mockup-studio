appId: app.mockupstudio.desktop
productName: Mockup Studio
copyright: Mockup Studio
# exact version and local binaries: no Electron download (the package declares a range)
electronVersion: 45.3.3
electronDist: ../../node_modules/electron/dist
directories:
  output: ../../dist
  buildResources: build
# The main process bundle already embeds all dependencies (only `electron` is external).
files:
  - out/**
  - '!out/cli/**' # the CLI goes to resources/cli (extraResources), outside the asar
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: ../editor/dist
    to: editor
  - from: ../../docs
    to: docs
  - from: build/icon.png
    to: icon.png
  # Bundled CLI (generated by scripts/build-cli.mjs): outside the asar, runs with ELECTRON_RUN_AS_NODE=1
  - from: out/cli
    to: cli
  # sharp (native, used by optimize_assets) outside the asar with its dependencies and the binary for the
  # installed platform (@img/sharp-<platform>); the server looks for it in resources/native/node_modules
  - from: ../../node_modules/sharp
    to: native/node_modules/sharp
    filter: ['package.json', 'LICENSE', 'lib/**']
  - from: ../../node_modules/@img
    to: native/node_modules/@img
  - from: ../../node_modules/detect-libc
    to: native/node_modules/detect-libc
  - from: ../../node_modules/semver
    to: native/node_modules/semver
  # skill/snippets to integrate with Claude Code and Codex (folder at the repository root)
  - from: ../../integrations
    to: integrations
  # component kits (*.mockup.json): the daemon finds them in resources/kits (packages/server/src/kits.ts)
  - from: ../../kits
    to: kits
  # ffmpeg for exporting mp4/webm/gif (main sets MOCKUP_FFMPEG to point here). The
  # ffmpeg-static downloads the platform binary on install (ffmpeg.exe on Windows, ffmpeg on
  # macOS/Linux); the binary's license (GPL) and README are included as well.
  - from: ../../node_modules/ffmpeg-static
    to: ffmpeg
    filter:
      - ffmpeg
      - ffmpeg.exe
      - '*.LICENSE'
      - '*.README'
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  artifactName: MockupStudio-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: MockupStudio-Setup-${version}-${arch}.${ext}
  include: build/installer.nsh
  installerLanguages:
    - en_US
  language: '1033'
portable:
  artifactName: MockupStudio-Portable-${version}-${arch}.${ext}
