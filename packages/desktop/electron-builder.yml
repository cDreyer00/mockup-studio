appId: app.mockupstudio.desktop
productName: Mockup Studio
copyright: Mockup Studio
# versão exata e binários locais: sem download do Electron (o pacote declara um intervalo)
electronVersion: 45.3.3
electronDist: ../../node_modules/electron/dist
directories:
  output: ../../dist
  buildResources: build
# O bundle do processo principal já embute todas as dependências (só `electron` é externo).
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: ../editor/dist
    to: editor
  - from: ../../docs
    to: docs
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  artifactName: MockupStudio-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: MockupStudio-Setup-${version}-${arch}.${ext}
  include: build/installer.nsh
portable:
  artifactName: MockupStudio-Portable-${version}-${arch}.${ext}
