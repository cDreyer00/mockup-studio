<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mockup Studio — Capture section</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Capture section</h1>
    <button id="start" type="button">Select section</button>
    <fieldset>
      <legend>Destination</legend>
      <label><input type="radio" name="mode" value="send" checked /> Send to Mockup Studio</label>
      <label><input type="radio" name="mode" value="copy" /> Copy to paste (Ctrl+V)</label>
    </fieldset>
    <label class="port">
      App port
      <input id="port" type="number" min="1" max="65535" value="4747" />
    </label>
    <p id="status" class="status" data-state="checking">Checking the app…</p>
    <p class="hint">
      Hover over the page and click to capture. Esc cancels; ↑ and ↓ switch between parent and
      child.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
